<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    <link rel="stylesheet" href="kert.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="body-auth">
    <div id="message-box"></div>
    
    <nav class="navbar">
        <div class="container">
            <div class="logo">
                <a href="index.html" style="text-decoration:none; display:flex; align-items:center;">
                    <img src="photo_2025-10-18_00-50-11.jpg" alt="Logo" class="logo-img">
                    <span class="site-name">КОЛДОН КЕЛЕТ</span>
                </a>
            </div>
            <div class="nav-links">
                <a href="index.html" class="btn btn-login">Главная</a>
            </div>
        </div>
    </nav>

    <div class="login-page">
        <div class="form-container">
            <div class="avatar-placeholder"><i class="fa-solid fa-user"></i></div>
            <h2>С возвращением</h2>
            
            <form id="login-form">
                <div class="input-group">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="email" placeholder="Email" required>
                </div>
                <div class="input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" placeholder="Пароль" required>
                </div>
                <button type="submit" class="btn-login-submit">ВОЙТИ</button>
            </form>
        </div>
        
        <div class="secondary-action-box">
            <a href="register.html" class="btn-register-link">Нет аккаунта? Зарегистрироваться</a>
        </div>
    </div>

    <script type="module" src="kert.js"></script>
</body>
</html>
