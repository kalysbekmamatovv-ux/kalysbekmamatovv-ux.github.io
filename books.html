<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Библиотека | КОЛДОН КЕЛЕТ</title>
    <link rel="stylesheet" href="kert.css"> 
    <link rel="stylesheet" href="books.css"> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="body-books">
    <div id="message-box"></div>
    
    <nav class="navbar">
        <div class="container">
            <div class="logo">
                <a href="index.html" style="text-decoration:none; display:flex; align-items:center;">
                    <img src="photo_2025-10-18_00-50-11.jpg" alt="Logo" class="logo-img">
                    <span class="site-name">КОЛДОН КЕЛЕТ</span>
                </a>
            </div>
            <div class="nav-links">
                <a href="index.html" class="btn btn-login">Главная</a>
                <!-- Кнопки входа загрузит JS -->
            </div>
        </div>
    </nav>

    <section class="books-section">
        <div class="container">
            <h2 class="section-title">Наша Библиотека</h2>
            <p class="section-subtitle">Материалы доступны только после входа.</p>
            
            <div class="book-list-wrapper" id="book-list-wrapper">
                <!-- Фильтры -->
                <div class="catalog-filter">
                    <button class="filter-btn active" data-filter="all">Все</button>
                    <button class="filter-btn" data-filter="programming">IT</button>
                    <button class="filter-btn" data-filter="business">Бизнес</button>
                    <button class="filter-btn" data-filter="literature">Книги</button>
                </div>

                <!-- Список книг -->
                <div class="book-list">
                    <!-- Книга 1 -->
                    <div class="book-item" data-category="literature">
                        <img src="images/unnamed.jpg" onerror="this.src='https://via.placeholder.com/300x220?text=No+Image'" class="book-cover" alt="Cover">
                        <h3>Тень семи гор</h3>
                        <p>Жанр: Драма, Боевик</p>
                        <div class="book-actions">
                            <a href="#" class="btn btn-primary">Читать</a>
                            <a href="#" class="btn btn-secondary">Скачать</a>
                        </div>
                    </div>

                    <!-- Книга 2 -->
                    <div class="book-item" data-category="business">
                        <img src="images/Batken.jpg" onerror="this.src='https://via.placeholder.com/300x220?text=No+Image'" class="book-cover" alt="Cover">
                        <h3>Бай атам сунуштайт</h3>
                        <p>Финансы, Бизнес</p>
                        <div class="book-actions">
                            <a href="#" class="btn btn-primary">Читать</a>
                            <a href="#" class="btn btn-secondary">Скачать</a>
                        </div>
                    </div>

                    <!-- Книга 3 -->
                    <div class="book-item" data-category="programming">
                        <img src="images/python.jpg" onerror="this.src='https://via.placeholder.com/300x220?text=Python'" class="book-cover" alt="Cover">
                        <h3>Изучаем Python</h3>
                        <p>Программирование для начинающих</p>
                        <div class="book-actions">
                            <a href="#" class="btn btn-primary">Читать</a>
                            <a href="#" class="btn btn-secondary">Скачать</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer class="contact-section">
        <div class="container">
            <p class="copyright">&copy; 2025 КОЛДОН КЕЛЕТ.</p>
        </div>
    </footer>

    <script type="module" src="kert.js"></script>
</body>
</html>
